# ==============================================================================
# mcp-server-kafka 生产级常驻 SSE 模式 Docker Compose 编排
# 默认拉取 GitHub Container Registry 官方多架构镜像 (amd64/arm64)
# ==============================================================================

services:
  mcp-server-kafka:
    # 官方镜像 (由 GitHub Actions 自动化多架构构建与发布)
    image: ghcr.io/atengk/mcp-server-kafka:latest

    # 若需要基于本地源码二次开发构建，解除下方 build 块注释即可:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: mcp-server-kafka
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Kafka 集群 Broker 引导地址（连接宿主机外部 Kafka 时使用 host.docker.internal）
      - MCP_KAFKA_BOOTSTRAP_SERVERS=${MCP_KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}

      # 运行时日志级别 (DEBUG, INFO, WARNING, ERROR)
      - MCP_KAFKA_LOG_LEVEL=${MCP_KAFKA_LOG_LEVEL:-INFO}

      # 双模传输网关协议与监听参数 (常驻 SSE 模式)
      - MCP_KAFKA_TRANSPORT=sse
      - MCP_KAFKA_SERVER_HOST=0.0.0.0
      - MCP_KAFKA_SERVER_PORT=8000
    extra_hosts:
      # 跨平台宿主机网络互通 (支持 Linux/macOS/Windows)
      - "host.docker.internal:host-gateway"
